name: Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # RustSec advisory DB scan against the committed Cargo.lock.
      - name: Cargo audit (RustSec advisories)
        uses: actions-rust-lang/audit@v1

  pattern-audit:
    name: pattern-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/run_code_audit.py shells out to `rg --files` to enumerate the
      # Rust sources; ubuntu-latest does not ship ripgrep, so install it first.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # Informational: default mode records the findings and exits 0.
      - name: Code audit (record findings)
        run: python3 scripts/run_code_audit.py

      # The raw strict gate is known not-clean (docs/code-audit.md): hits include test
      # assertions and legacy invariants. Run it, but never fail the job on it.
      - name: Code audit (strict gate, non-blocking)
        run: python3 scripts/run_code_audit.py --strict || true

      - name: Upload code audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-log
          path: validation/results/code-audit.log
          if-no-files-found: warn

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: miri

      - name: Miri setup
        run: cargo miri setup

      # Experimental UB detector for the geometry/serde core. Miri's own isolation is
      # deterministic; forwarding host entropy (`-Zmiri-disable-isolation`) made runs
      # flaky. The desktop crate needs a display and is out of scope.
      # The storage and native_tests modules exercise real-filesystem atomic writes
      # (fsync/rename), which Miri does not emulate — they abort the run and are
      # covered natively by `cargo test --workspace`.
      # Miri findings are real signals and must not be masked: no continue-on-error,
      # so an unsoundness or UB report fails this job loudly.
      - name: Miri test forge-core
        run: 'cargo miri test -p forge-core --lib -- --skip storage::tests --skip native_tests::'
        timeout-minutes: 60
