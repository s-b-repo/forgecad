[workspace]
members = ["apps/craft-suite", "apps/forge-cli", "crates/forge-core", "crates/forge-dwg", "crates/forge-modeling"]
default-members = ["apps/craft-suite"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
