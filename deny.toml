# cargo-deny policy for the Forge CAD workspace.
#
# The allow list below was built by enumerating the SPDX `license`/`license_file`
# fields of every package named in Cargo.lock (via `cargo metadata --format-version
# 1`, the same data cargo-deny itself consumes), cross-checked against the
# `license` field of each crate's manifest in ~/.cargo/registry/src.
# Cargo.lock carries 367 packages: 362 crates.io packages plus the 5 workspace
# members (forge-core, forge-modeling, forge-dwg, forge-cli, forge-craft), all of
# which declare `license = "MIT"` through `license.workspace = true`.
# No package is license-file-only - every crate publishes an SPDX expression - so
# no exceptions entry for missing identifiers is needed.
#
# Without this file cargo-deny falls back to its default config, whose allow list
# is empty and therefore rejects the entire tree; that is what the 2026-11-12 CI
# run reported as "error[rejected]: failed to satisfy license requirements".

[licenses]
# Exactly the distinct SPDX identifiers present in the dependency tree.
allow = [
    # Permissive core of the tree (Rust ecosystem, egui/winit, serde, ...).
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # rustix / linux-raw-sys / wasi
    "BSD-2-Clause",                   # ruststep (Inflector) -> truck-stepio -> forge-modeling
    "BSD-3-Clause",                   # moxcms, pxfm, num_enum, encoding_rs
    "ISC",                            # libloading
    "Zlib",                           # zlib-rs, foldhash, slotmap
    "0BSD",                           # adler2 -> miniz_oxide -> png/image -> eframe
    "BSL-1.0",                        # clipboard-win, error-code (Windows-only)
    "Unlicense",                      # memchr, aho-corasick, byteorder, winapi-util, same-file
    # Font/text data licenses required by the egui desktop stack.
    "Unicode-3.0", # unicode-ident, unicode-properties: (MIT OR Apache-2.0) AND Unicode-3.0
    "OFL-1.1",     # epaint_default_fonts: (MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0
    "Ubuntu-font-1.0",
    # Copyleft of the two cases below is weak/file-level, and both crates also
    # offer a permissive alternative inside the same expression, so neither
    # restricts how the workspace is redistributed.
    "MPL-2.0",           # acadrust 0.6.8: unmodified DWG engine (crate source available)
    "LGPL-2.1-or-later", # r-efi: only reachable via "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
    "GPL-2.0-only",      # self_cell: only reachable via "Apache-2.0 OR GPL-2.0-only"
]
# Anything not listed above is denied; cargo-deny no longer takes a `default` key.
# If a dependency ever switches to license-file-only there is nothing to match an
# identifier against, so cargo-deny reports it instead of us guessing.
confidence-threshold = 0.8

[advisories]
# The two unmaintained advisories below carry no vulnerability, yet cargo-deny
# reports them as errors by default (not warnings), which is what kept failing the
# supply-chain job after the license policy was fixed. Neither has a safe upgrade:
#   RUSTSEC-2024-0370 - proc-macro-error 1.0.4, only via ruststep-derive/truck-*
#   RUSTSEC-2026-0196 - cgmath 0.18.0, only via truck-geometry/matext4cgmath
# They are ignored by ID, so every other advisory - including newly reported
# unmaintained crates and all vulnerabilities - still fails the build.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0196",
]

[bans]
# The lockfile resolves 26 crates to more than one version (syn 1/2/3, hashbrown,
# itertools, windows-sys, ...). cargo-deny reports these as warnings, never errors;
# they are upstream fork points rather than workspace bugs, so they stay visible
# in the log as warnings instead of being denied or hidden.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
