[package]
name = "forge-cli-validation"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "forge"
path = "../../apps/forge-cli/src/main.rs"

[[test]]
name = "cli"
path = "../../apps/forge-cli/tests/cli.rs"

[[test]]
name = "remaining_cli"
path = "../../apps/forge-cli/tests/remaining_cli.rs"

[dependencies]
forge-core = { path = "../../crates/forge-core" }
forge-dwg = { path = "../../crates/forge-dwg" }
forge-modeling = { path = "../../crates/forge-modeling" }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
